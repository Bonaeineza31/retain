<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Retain, a personal expense and budget manager." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Retain</title>
    <script>
      // paints the page dark right away, so there is no white flash before the app starts
      try {
        var mode = localStorage.getItem('retain.colorMode')
        if (mode === 'dark' || (!mode && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.style.background = '#0E1126'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
